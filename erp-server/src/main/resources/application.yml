server:
  port: 8080
  # 统一 /api 前缀,前端 Vite 代理无需改写路径
  servlet:
    context-path: /api

spring:
  datasource:
    # 开发环境关闭加密;生产建议启用 encrypt=true 并配置受信证书
    url: jdbc:sqlserver://localhost:1433;databaseName=erp;encrypt=false;trustServerCertificate=true
    # 开发专用账号 erp_app(仅 db_owner@erp),由 sqlcmd 创建;生产环境用环境变量覆盖
    username: ${DB_USER:erp_app}
    password: ${DB_PASSWORD:ErpApp_2026_x7K9}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL,生产环境移除
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.erp: debug
